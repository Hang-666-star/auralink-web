name: Deploy to Production

on:
  push:
    branches:
      - release

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
    concurrency:
      group: production-deployment
      cancel-in-progress: false
    timeout-minutes: 15

    steps:
      - name: Deploy verified release to production
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            set -Eeuo pipefail
            git -C /root/autodl-tmp/auralink-github-staging/auralink-web fetch --no-tags origin release
            /root/autodl-tmp/auralink-web-deploy/bin/deploy-web.sh deploy "${{ github.sha }}"
