name: Deploy to Production

on:
  push:
    branches:
      - release

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
    concurrency:
      group: production-deployment
      cancel-in-progress: false
    timeout-minutes: 15

    steps:
      - name: Deploy verified release to production
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            set -Eeuo pipefail

            expected_sha="${{ github.sha }}"
            staging_dir=/root/autodl-tmp/auralink-github-staging/auralink-web
            deploy_helper=/root/autodl-tmp/auralink-web-deploy/bin/deploy-web.sh

            if ! staging_prefix="$(git -C "$staging_dir" rev-parse --show-prefix)" || [ -n "$staging_prefix" ]; then
              echo "Web staging directory is not a Git repository" >&2
              exit 1
            fi

            if [ ! -x "$deploy_helper" ]; then
              echo "Web deployment helper is not executable" >&2
              exit 1
            fi

            fetch_ok=0
            for attempt in 1 2 3; do
              echo "Fetching release branch: attempt ${attempt}/3"
              if timeout 60 git -c http.version=HTTP/1.1 \
                -C "$staging_dir" \
                fetch --no-tags origin release
              then
                fetch_ok=1
                break
              fi

              if [ "$attempt" -lt 3 ]; then
                sleep $((attempt * 5))
              fi
            done

            if [ "$fetch_ok" -ne 1 ]; then
              echo "Failed to fetch release after 3 attempts" >&2
              exit 1
            fi

            fetched_sha="$(git -C "$staging_dir" rev-parse --verify 'FETCH_HEAD^{commit}')"
            if [ "$fetched_sha" != "$expected_sha" ]; then
              echo "Release changed while this deployment was queued; refusing to deploy $expected_sha (fetched $fetched_sha)" >&2
              exit 1
            fi

            "$deploy_helper" deploy "$expected_sha"

